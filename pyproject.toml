[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "FAGENT"
version = "0.1.0"
description = "Local GDS DRC LangGraph agent"
requires-python = ">=3.10"

[project.scripts]
fagent = "FAGENT.fagent:Fagent.main"

[tool.setuptools.packages.find]
include = ["FAGENT*", "CALIBRE*"]

[tool.setuptools.package-data]
FAGENT = ["config.example.json", "knowledge/templates/prompts/*.md", "knowledge/templates/schemas/*.json", "knowledge/templates/reports/*", "tasks/*/workflow.yaml", "tasks/*/prompts/*.md", "tasks/*/schemas/*.json"]
