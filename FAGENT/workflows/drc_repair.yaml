task: drc
version: 1
prompts: [knowledge/prompts/drc.md]
protocol: knowledge/prompts/protocol.md
tools: workflows/tools/drc.json
schema: workflows/schemas/drc.json
review_prompt: knowledge/prompts/review.md
review_schema: workflows/schemas/review.json
inputs: [gds, drc, layer_map]
backend: local
steps:
  - {id: read, action: read_drc}
  - {id: repair, action: repair_drc, requires: [read]}
  - {id: validate, action: validate_drc, requires: [repair]}
  - {id: human_review, action: review, requires: [validate]}
