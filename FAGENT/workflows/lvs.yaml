task: lvs
version: 1
prompts: [knowledge/prompts/lvs.md]
protocol: knowledge/prompts/protocol.md
schema: workflows/schemas/lvs.json
review_prompt: knowledge/prompts/review.md
review_schema: workflows/schemas/review.json
inputs: []
backend: local
mock_pass: true
steps:
  - {id: read, action: read_lvs}
  - {id: repair, action: repair_lvs, requires: [read]}
  - {id: validate, action: validate_lvs, requires: [repair]}
  - {id: human_review, action: review, requires: [validate]}
