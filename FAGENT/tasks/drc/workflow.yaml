task: drc
version: 2
entry: read
request_builder: model_payload:build_request
prompts:
- prompts/repair.md
protocol: knowledge/templates/prompts/protocol.md
schema: schemas/drc.json
review_prompt: knowledge/templates/prompts/review.md
review_schema: knowledge/templates/schemas/review.json
inputs:
- gds
- drc
- layer_map
backend: local
nodes:
- id: read
  action:
    - steps:read_drc
    - steps:read_gds
  next: repair
- id: repair
  action: agent
  router: steps:repair_route
  routes:
    continue: repair
    verify: verify
    repeated: record_unresolved
    finished: save
  tools:
  - tools:fix_cover
  - tools:fix_area
  - tools:check_cover
  - tools:check_area
- id: verify
  action: steps:verify_current_task
  next: repair
- id: record_unresolved
  action: steps:record_repeated_proposal
  router: steps:queue_route
  routes:
    continue: repair
    finished: save
- id: save
  action: steps:save_gds
  next: END
prepare: steps:prepare
layout_services: true
